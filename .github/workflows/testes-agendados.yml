name: Testes Cypress Agendados

on:
  workflow_dispatch:

  schedule:
    - cron: '0 21 * * *'
      timezone: 'America/Sao_Paulo'

jobs:
  testes-e2e:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar o projeto
        uses: actions/checkout@v4

      - name: Configurar o Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: exemplo-cypress-pipeline/package-lock.json

      - name: Instalar dependências
        working-directory: exemplo-cypress-pipeline
        run: npm ci

      - name: Executar os testes Cypress
        working-directory: exemplo-cypress-pipeline
        run: npm test

      - name: Salvar evidências em caso de falha
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: evidencias-cypress
          path: |
            exemplo-cypress-pipeline/cypress/screenshots
            exemplo-cypress-pipeline/cypress/videos
          if-no-files-found: ignore